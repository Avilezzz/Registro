<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Eventos</title>

<script src="https://cdn.tailwindcss.com"></script>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

const supabaseUrl = 'https://mdcayyifejqfvvoiphmi.supabase.co';
const supabaseKey = 'sb_publishable_lEzIrscGXzVAJ-c00FT2GQ_BMuHsVmK';

window.supabase = createClient(supabaseUrl, supabaseKey);
</script>
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

<div class="bg-white shadow-xl rounded-2xl p-6 w-full max-w-md">

<h1 class="text-2xl font-bold text-center mb-6">
Registro de Participantes
</h1>

<form id="registroForm" class="space-y-4">

<div>
<label class="font-semibold">Nombre y Apellido</label>
<input
id="nombre"
type="text"
required
class="w-full border rounded-lg p-3 mt-1"
placeholder="Nombre completo">
</div>

<div>
<label class="font-semibold">Curso</label>
<input
id="curso"
type="text"
required
class="w-full border rounded-lg p-3 mt-1"
placeholder="Ej: QUINTO A">
</div>
<div>
    <label class="font-semibold">
        Evento
    </label>

    <select
        id="evento"
        required
        class="w-full border rounded-lg p-3 mt-1">

        <option value="">
            Seleccione un evento
        </option>

    </select>
</div>
<div>
<label class="font-semibold">Número de Teléfono</label>
<input
id="telefono"
type="tel"
required
class="w-full border rounded-lg p-3 mt-1"
placeholder="0999999999">
</div>


<div class="flex items-center gap-3">
<input
id="participa"
type="checkbox"
checked
class="w-5 h-5">
<label class="font-semibold">
Confirmo que participaré en el evento
</label>
</div>

<button
type="submit"
class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700">
Registrar
</button>

</form>

<div id="mensaje" class="mt-4 text-center"></div>

</div>

<script type="module">

function limpiarTexto(texto){
    return texto
        .trim()
        .replace(/\s+/g,' ')
        .toUpperCase();
}

async function cargarEventos(){

    const { data, error } = await window.supabase
        .from('eventos')
        .select('*')
        .order('nombre');

    if(error){
        console.error(error);
        return;
    }

    const select = document.getElementById('evento');

    select.innerHTML =
        '<option value="">Seleccione un evento</option>';

    data.forEach(evento => {

        select.innerHTML += `
            <option value="${evento.id}">
                ${evento.nombre}
            </option>
        `;

    });

}

await cargarEventos();

document
.getElementById('registroForm')
.addEventListener('submit', async (e)=>{

    e.preventDefault();

    const boton =
        e.target.querySelector('button[type="submit"]');

    boton.disabled = true;
    boton.textContent = 'Guardando...';

    const nombre = limpiarTexto(
        document.getElementById('nombre').value
    );

    const curso = limpiarTexto(
        document.getElementById('curso').value
    );

    const telefonoOriginal =
        document.getElementById('telefono')
        .value
        .replace(/\D/g,'');

    const participa =
        document.getElementById('participa').checked;

    const eventoId =
        Number(
            document.getElementById('evento').value
        );

    const whatsappLink =
        `https://wa.me/593${telefonoOriginal.replace(/^0/,'')}`;

    const { error } = await window.supabase
        .from('registro_eventos')
        .insert([{

            nombre_apellido: nombre,
            participa: participa,
            curso: curso,
            telefono: telefonoOriginal,
            whatsapp_link: whatsappLink,
            evento_id: eventoId

        }]);

    const mensaje =
        document.getElementById('mensaje');

    if(error){

        mensaje.innerHTML = `
            <div class="bg-red-100 text-red-700 p-3 rounded-lg">
                ${error.message}
            </div>
        `;

        boton.disabled = false;
        boton.textContent = 'Registrar';

        return;
    }

    mensaje.innerHTML = `
        <div class="bg-green-100 text-green-700 p-3 rounded-lg">
            Registro guardado correctamente
        </div>
    `;

    document
        .getElementById('registroForm')
        .reset();

    boton.disabled = false;
    boton.textContent = 'Registrar';

});

</script> 
</body>
</html>
