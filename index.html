<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Eventos</title>

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>emailjs.init("5tNGraAK_s0gjLTmU");</script>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  window.supabase = createClient(
    'https://mdcayyifejqfvvoiphmi.supabase.co',
    'sb_publishable_lEzIrscGXzVAJ-c00FT2GQ_BMuHsVmK'
  );
</script>

<style>
  :root {
    --blue:      #2563eb;
    --blue-dark: #1d4ed8;
    --blue-soft: #eff6ff;
    --green:     #16a34a;
    --red:       #dc2626;
    --yellow:    #d97706;
    --slate-800: #1e293b;
    --slate-500: #64748b;
    --slate-200: #e2e8f0;
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Sora', sans-serif;
    min-height: 100vh;
    background: linear-gradient(140deg, #eff6ff 0%, #dbeafe 45%, #f0fdf4 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  /* ── Card ── */
  .reg-card {
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 12px 48px rgba(37,99,235,.12), 0 2px 8px rgba(0,0,0,.06);
    padding: 2.5rem 2.25rem 2rem;
    width: 100%;
    max-width: 460px;
  }

  /* ── Header ── */
  .reg-header-icon {
    width: 56px; height: 56px;
    background: linear-gradient(135deg, var(--blue), var(--blue-dark));
    border-radius: 16px;
    display: inline-flex; align-items: center; justify-content: center;
    margin-bottom: 12px;
  }

  /* ── Labels ── */
  .reg-label {
    font-size: .8rem;
    font-weight: 600;
    color: var(--slate-500);
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-bottom: 5px;
    display: block;
  }

  /* ── Inputs ── */
  .reg-input {
    width: 100%;
    border: 1.5px solid var(--slate-200);
    border-radius: 11px;
    padding: .72rem 1rem;
    font-family: 'Sora', sans-serif;
    font-size: .93rem;
    color: var(--slate-800);
    background: #f8fafc;
    outline: none;
    transition: border-color .18s, box-shadow .18s, background .18s;
    appearance: none;
  }
  .reg-input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3.5px rgba(37,99,235,.13);
    background: #fff;
  }
  /* valid / invalid states */
  .reg-input.is-valid-field  { border-color: #22c55e !important; background: #f0fdf4; }
  .reg-input.is-invalid-field{ border-color: var(--red) !important; background: #fff5f5; }

  .field-msg {
    font-size: .75rem;
    margin-top: 4px;
    min-height: 16px;
    display: block;
  }
  .field-msg.ok  { color: var(--green); }
  .field-msg.err { color: var(--red);   }

  /* icon wrapper */
  .input-wrap { position: relative; }
  .input-wrap .inp-icon {
    position: absolute; right: 13px; top: 50%; transform: translateY(-50%);
    font-size: .95rem; pointer-events: none; color: #94a3b8;
  }

  /* ── Checkbox area ── */
  .check-area {
    background: var(--blue-soft);
    border: 1px solid #bfdbfe;
    border-radius: 12px;
    padding: 12px 14px;
    display: flex; align-items: flex-start; gap: 12px;
    cursor: pointer;
    transition: background .15s;
  }
  .check-area:hover { background: #dbeafe; }
  .check-area input[type=checkbox] {
    width: 18px; height: 18px; margin-top: 2px;
    accent-color: var(--blue); cursor: pointer; flex-shrink: 0;
  }
  .check-area label { font-size: .88rem; color: var(--slate-800); cursor: pointer; line-height: 1.5; }

  /* ── Submit button ── */
  .btn-reg {
    width: 100%;
    background: linear-gradient(135deg, var(--blue), var(--blue-dark));
    color: #fff;
    padding: .88rem;
    border-radius: 13px;
    font-weight: 700;
    font-size: 1rem;
    border: none;
    cursor: pointer;
    transition: opacity .2s, transform .1s, box-shadow .2s;
    letter-spacing: .02em;
    box-shadow: 0 4px 14px rgba(37,99,235,.3);
  }
  .btn-reg:hover:not(:disabled)  { opacity: .88; box-shadow: 0 6px 20px rgba(37,99,235,.38); }
  .btn-reg:active:not(:disabled) { transform: scale(.98); }
  .btn-reg:disabled { opacity: .6; cursor: not-allowed; box-shadow: none; }

  /* ── Spinner ── */
  .spinner-sm {
    display: inline-block; width: 15px; height: 15px;
    border: 2px solid rgba(255,255,255,.35); border-top-color: #fff;
    border-radius: 50%; animation: spin .65s linear infinite;
    vertical-align: middle; margin-right: 7px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Toast container ── */
  #toastArea {
    position: fixed; top: 20px; right: 20px; z-index: 9999;
    display: flex; flex-direction: column; gap: 10px;
    pointer-events: none;
  }
  .toast-item {
    min-width: 280px; max-width: 340px;
    border-radius: 14px;
    padding: 14px 18px;
    font-size: .88rem;
    font-family: 'Sora', sans-serif;
    display: flex; align-items: flex-start; gap: 11px;
    box-shadow: 0 8px 32px rgba(0,0,0,.14);
    pointer-events: all;
    animation: toastIn .3s cubic-bezier(.34,1.56,.64,1) both;
  }
  .toast-item.hide { animation: toastOut .3s ease forwards; }

  .toast-success { background: #f0fdf4; border: 1.5px solid #86efac; color: #14532d; }
  .toast-error   { background: #fff5f5; border: 1.5px solid #fca5a5; color: #7f1d1d; }
  .toast-warning { background: #fffbeb; border: 1.5px solid #fcd34d; color: #78350f; }
  .toast-info    { background: var(--blue-soft); border: 1.5px solid #93c5fd; color: #1e3a8a; }

  .toast-icon { font-size: 1.15rem; flex-shrink: 0; margin-top: 1px; }
  .toast-body { flex: 1; line-height: 1.45; }
  .toast-body strong { display: block; font-size: .92rem; margin-bottom: 2px; }
  .toast-close {
    background: none; border: none; cursor: pointer;
    font-size: 1rem; color: inherit; opacity: .5; padding: 0; flex-shrink: 0;
    line-height: 1;
  }
  .toast-close:hover { opacity: 1; }

  @keyframes toastIn  { from { opacity:0; transform: translateX(30px) scale(.95); } to { opacity:1; transform: none; } }
  @keyframes toastOut { from { opacity:1; transform: none; } to { opacity:0; transform: translateX(30px) scale(.95); } }

  /* ── divider ── */
  .reg-divider { border: none; border-top: 1.5px solid #f1f5f9; margin: 1.1rem 0; }
</style>
</head>

<body>

<!-- Toast Area -->
<div id="toastArea"></div>

<div class="reg-card">

  <!-- Header -->
  <div class="text-center mb-4">
    <div class="reg-header-icon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
    </div>
    <h1 style="font-size:1.45rem; font-weight:700; color:var(--slate-800); margin:0 0 4px;">
      Registro de Participantes
    </h1>
    <p style="font-size:.83rem; color:var(--slate-500); margin:0;">
      Completa los datos — recibirás confirmación por correo
    </p>
  </div>

  <hr class="reg-divider">

  <form id="registroForm" novalidate autocomplete="off">
    <div style="display:flex; flex-direction:column; gap:14px;">

      <!-- Nombre -->
      <div>
        <label class="reg-label" for="nombre">Nombre y Apellido</label>
        <input id="nombre" type="text" class="reg-input" placeholder="Ej: Albert Einstein" maxlength="80">
        <span class="field-msg" id="msg-nombre"></span>
      </div>

      <!-- Curso -->
      <div>
        <label class="reg-label" for="curso">Curso</label>
        <input id="curso" type="text" class="reg-input" placeholder="Ej: QUINTO A" maxlength="30">
        <span class="field-msg" id="msg-curso"></span>
      </div>

      <!-- Sexo -->
      <div>
        <label class="reg-label" for="sexo">Sexo</label>
        <div class="input-wrap">
          <select id="sexo" class="reg-input" style="padding-right:2.2rem;">
            <option value="">Seleccione…</option>
          </select>
          <span class="inp-icon">▾</span>
        </div>
        <span class="field-msg" id="msg-sexo"></span>
      </div>

      <!-- Evento -->
      <div>
        <label class="reg-label" for="evento">Evento</label>
        <div class="input-wrap">
          <select id="evento" class="reg-input" style="padding-right:2.2rem;">
            <option value="">Seleccione un evento…</option>
          </select>
          <span class="inp-icon">▾</span>
        </div>
        <span class="field-msg" id="msg-evento"></span>
      </div>

      <!-- Teléfono -->
      <div>
        <label class="reg-label" for="telefono">Número de Teléfono</label>
        <div class="input-wrap">
          <input id="telefono" type="tel" class="reg-input" placeholder="0999999999"
                 maxlength="15" style="padding-right:2.2rem;">
          <span class="inp-icon">📱</span>
        </div>
        <span class="field-msg" id="msg-telefono"></span>
      </div>

      <!-- Correo -->
      <div>
        <label class="reg-label" for="correo">Correo Electrónico</label>
        <div class="input-wrap">
          <input id="correo" type="email" class="reg-input" placeholder="ejemplo@correo.com"
                 maxlength="100" style="padding-right:2.2rem;">
          <span class="inp-icon">✉️</span>
        </div>
        <span class="field-msg" id="msg-correo"></span>
      </div>

      <!-- Checkbox -->
      <label class="check-area">
        <input id="participa" type="checkbox" checked>
        <span>Confirmo que <strong style="font-weight:700;">participaré</strong> en el evento seleccionado</span>
      </label>

      <hr class="reg-divider" style="margin:0;">

      <!-- Botón -->
      <button type="submit" class="btn-reg" id="btnSubmit">
        Registrar
      </button>

    </div>
  </form>

  <hr class="reg-divider">
  <p style="text-align:center; font-size:.83rem; color:var(--slate-500); margin:0;">
    ¿Ya estás registrado?
    <a href="uniformes.html" style="color:var(--blue); font-weight:600; text-decoration:none;">
      Registra tu camisa y talla →
    </a>
  </p>

</div>

<!-- ═══════════════════════════════════════════════════ -->
<script type="module">

const EMAILJS_SERVICE_ID  = "service_xdg8iho";
const EMAILJS_TEMPLATE_ID = "template_4dg8nev";

/* ── Toast ── */
function toast(type, title, body = '', duration = 4500) {
  const icons = { success:'✅', error:'❌', warning:'⚠️', info:'ℹ️' };
  const area  = document.getElementById('toastArea');

  const el = document.createElement('div');
  el.className = `toast-item toast-${type}`;
  el.innerHTML = `
    <span class="toast-icon">${icons[type]}</span>
    <div class="toast-body"><strong>${title}</strong>${body ? body : ''}</div>
    <button class="toast-close" onclick="this.closest('.toast-item').remove()">✕</button>
  `;
  area.appendChild(el);

  setTimeout(() => {
    el.classList.add('hide');
    setTimeout(() => el.remove(), 320);
  }, duration);
}

/* ── Validación por campo ── */
const rules = {
  nombre:   { min:3,  re: /^[a-záéíóúüñA-ZÁÉÍÓÚÜÑ\s'-]{3,}$/, msg: 'Ingresa tu nombre completo (solo letras).' },
  curso:    { min:2,  re: /^[a-zA-Z0-9\s]+$/,                   msg: 'Curso inválido (letras y números).' },
  sexo:     { msg: 'Selecciona el sexo.' },
  evento:   { msg: 'Selecciona un evento.' },
  telefono: { re: /^0[0-9]{9}$/, msg: 'Debe ser 10 dígitos, empezando en 0. Ej: 0999999999' },
  correo:   { re: /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/, msg: 'Ingresa un correo válido.' }
};

function validateField(id) {
  const el  = document.getElementById(id);
  const msg = document.getElementById('msg-' + id);
  const val = el.value.trim();
  const r   = rules[id];
  let ok = true;

  if (id === 'evento' || id === 'sexo') {
    ok = val !== '';
  } else {
    if (!val) { ok = false; }
    else if (r.re && !r.re.test(val)) { ok = false; }
  }

  el.classList.toggle('is-valid-field',   ok);
  el.classList.toggle('is-invalid-field', !ok);

  if (!ok) {
    msg.textContent = val === '' ? 'Este campo es obligatorio.' : r.msg;
    msg.className   = 'field-msg err';
  } else {
    msg.textContent = '✓ Correcto';
    msg.className   = 'field-msg ok';
  }
  return ok;
}

['nombre','curso','sexo','evento','telefono','correo'].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('blur', () => validateField(id));
  el.addEventListener('input', () => {
    if (el.classList.contains('is-invalid-field')) validateField(id);
  });
});

/* ── Limpiar texto ── */
function clean(t) { return t.trim().replace(/\s+/g,' ').toUpperCase(); }

/* ── Cargar eventos ── */
async function cargarEventos() {
  const { data, error } = await window.supabase
    .from('eventos').select('*').order('nombre');

  if (error) { toast('error','No se pudieron cargar los eventos', error.message); return; }

  const sel = document.getElementById('evento');
  sel.innerHTML = '<option value="">Seleccione un evento…</option>';
  data.forEach(ev => {
    const o = document.createElement('option');
    o.value = ev.id; o.dataset.nombre = ev.nombre; o.textContent = ev.nombre;
    sel.appendChild(o);
  });
}
await cargarEventos();

/* ── Cargar sexos ── */
async function cargarSexos() {
  const { data, error } = await window.supabase
    .from('sexos').select('*').order('id');

  if (error) { toast('error','No se pudieron cargar los sexos', error.message); return; }

  const sel = document.getElementById('sexo');
  sel.innerHTML = '<option value="">Seleccione…</option>';
  data.forEach(s => {
    const o = document.createElement('option');
    o.value = s.id; o.textContent = s.nombre;
    sel.appendChild(o);
  });
}
await cargarSexos();

/* ── Submit ── */
document.getElementById('registroForm').addEventListener('submit', async e => {
  e.preventDefault();

  // Validar todos
  const campos = ['nombre','curso','sexo','evento','telefono','correo'];
  const validos = campos.map(validateField);
  if (validos.includes(false)) {
    toast('warning', 'Revisa el formulario', 'Hay campos con errores o vacíos.');
    return;
  }

  const boton = document.getElementById('btnSubmit');
  boton.disabled = true;
  boton.innerHTML = '<span class="spinner-sm"></span>Guardando…';

  const nombre    = clean(document.getElementById('nombre').value);
  const curso     = clean(document.getElementById('curso').value);
  const correo    = document.getElementById('correo').value.trim().toLowerCase();
  const telefono  = document.getElementById('telefono').value.replace(/\D/g,'');
  const participa = document.getElementById('participa').checked;

  const eventoSel    = document.getElementById('evento');
  const eventoId     = Number(eventoSel.value);
  const eventoNombre = eventoSel.options[eventoSel.selectedIndex]?.dataset.nombre || '';
  const sexoId       = Number(document.getElementById('sexo').value);
  const whatsappLink = `https://wa.me/593${telefono.replace(/^0/,'')}`;

  /* 1 — Supabase */
  const { error: dbError } = await window.supabase
    .from('registro_eventos')
    .insert([{
      nombre_apellido: nombre,
      participa,
      curso,
      telefono,
      whatsapp_link: whatsappLink,
      evento_id:     eventoId,
      sexo_id:       sexoId,
      correo
    }]);

  if (dbError) {
    toast('error', 'Error al guardar', dbError.message, 6000);
    boton.disabled = false; boton.innerHTML = 'Registrar';
    return;
  }

  /* 2 — EmailJS */
  try {
    await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
      to_email:  correo,
      to_name:   nombre,
      curso,
      evento:    eventoNombre,
      participa: participa ? 'Sí confirmó participación' : 'No confirmará',
      telefono,
      whatsapp:  whatsappLink
    });
  } catch (err) {
    console.error('EmailJS:', err);
    toast('warning','Registro guardado','No se pudo enviar el correo de confirmación.', 6000);
    boton.disabled = false; boton.innerHTML = 'Registrar';
    return;
  }

  /* 3 — Éxito */
  toast('success', '¡Registro exitoso!', `Confirmación enviada a <strong>${correo}</strong>`, 6000);
  document.getElementById('registroForm').reset();

  // limpiar estados visuales
  ['nombre','curso','sexo','evento','telefono','correo'].forEach(id => {
    const el = document.getElementById(id);
    el.classList.remove('is-valid-field','is-invalid-field');
    document.getElementById('msg-'+id).textContent = '';
  });

  boton.disabled = false; boton.innerHTML = 'Registrar';
});
</script>
</body>
</html>
