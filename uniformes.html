<style>
  :root {
    --blue:      #2563eb;
    --blue-dark: #1d4ed8;
    --blue-soft: #eff6ff;
    --green:     #16a34a;
    --red:       #dc2626;
    --slate-800: #1e293b;
    --slate-500: #64748b;
    --slate-200: #e2e8f0;
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Sora', sans-serif;
    min-height: 100vh;
    background: linear-gradient(140deg, #eff6ff 0%, #dbeafe 45%, #f0fdf4 100%);
    padding: 32px 16px;
    color: var(--slate-800);
  }

  .wrap { max-width: 720px; margin: 0 auto; }

  /* ── Header ── */
  .page-head {
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 12px 48px rgba(37,99,235,.12), 0 2px 8px rgba(0,0,0,.06);
    padding: 1.8rem 1.8rem 1.5rem;
    text-align: center;
    margin-bottom: 18px;
  }
  .head-icon {
    width: 56px; height: 56px;
    background: linear-gradient(135deg, var(--blue), var(--blue-dark));
    border-radius: 16px;
    display: inline-flex; align-items: center; justify-content: center;
    margin-bottom: 12px;
  }
  .page-head h1 { font-size: 1.45rem; font-weight: 700; margin: 0 0 4px; }
  .page-head p  { font-size: .85rem; color: var(--slate-500); margin: 0; }

  .btn-registrarse {
    display: inline-flex; align-items: center; gap: 8px;
    margin-top: 8px;
    background: linear-gradient(135deg, var(--green), #15803d);
    color: #fff; text-decoration: none;
    padding: .6rem 1.2rem; border-radius: 12px;
    font-weight: 700; font-size: .88rem;
    box-shadow: 0 4px 14px rgba(22,163,74,.3);
    transition: opacity .2s, transform .1s;
  }
  .btn-registrarse:hover  { opacity: .9; color: #fff; }
  .btn-registrarse:active { transform: scale(.97); }

  /* ── Barra de progreso ── */
  .progress-block { margin-top: 18px; }
  .progress-text {
    font-size: .82rem; font-weight: 600; color: var(--slate-800);
    margin-bottom: 7px;
  }
  .progress-text strong { color: var(--blue-dark); }
  .progress-track {
    width: 100%; height: 10px;
    background: var(--slate-200); border-radius: 99px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; border-radius: 99px;
    background: linear-gradient(90deg, var(--blue), var(--green));
    transition: width .5s cubic-bezier(.34,1.2,.64,1);
  }

  /* ── Search ── */
  .search-box {
    width: 100%;
    border: 1.5px solid var(--slate-200);
    border-radius: 13px;
    padding: .8rem 1rem;
    font-family: 'Sora', sans-serif;
    font-size: .93rem;
    background: #fff;
    outline: none;
    margin-bottom: 16px;
    transition: border-color .18s, box-shadow .18s;
  }
  .search-box:focus { border-color: var(--blue); box-shadow: 0 0 0 3.5px rgba(37,99,235,.13); }

  /* ── Person card ── */
  .person {
    background: #fff;
    border: 1.5px solid var(--slate-200);
    border-radius: 16px;
    padding: 14px 16px;
    display: flex; align-items: center; gap: 14px;
    cursor: pointer;
    transition: border-color .15s, box-shadow .15s, transform .1s;
    margin-bottom: 10px;
  }
  .person:hover  { border-color: var(--blue); box-shadow: 0 6px 20px rgba(37,99,235,.12); }
  .person:active { transform: scale(.99); }

  .avatar {
    width: 42px; height: 42px; border-radius: 50%;
    background: var(--blue-soft); color: var(--blue-dark);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; flex-shrink: 0;
  }
  .person-info { flex: 1; min-width: 0; }
  .person-name { font-weight: 600; font-size: .98rem; }
  .person-sub  { font-size: .78rem; color: var(--slate-500); }

  .badge-state {
    font-size: .72rem; font-weight: 600;
    padding: 5px 10px; border-radius: 20px;
    white-space: nowrap; flex-shrink: 0;
  }
  .badge-pend { background: #fffbeb; color: #92400e; border: 1px solid #fcd34d; }
  .badge-done { background: #f0fdf4; color: #14532d; border: 1px solid #86efac; }

  .empty { text-align: center; color: var(--slate-500); padding: 40px 0; }

  /* ── Inputs (modal) ── */
  .reg-label {
    font-size: .8rem; font-weight: 600; color: var(--slate-500);
    text-transform: uppercase; letter-spacing: .5px;
    margin-bottom: 5px; display: block;
  }
  .reg-input {
    width: 100%;
    border: 1.5px solid var(--slate-200);
    border-radius: 11px;
    padding: .72rem 1rem;
    font-family: 'Sora', sans-serif;
    font-size: .93rem; color: var(--slate-800);
    background: #f8fafc; outline: none;
    transition: border-color .18s, box-shadow .18s, background .18s;
  }
  .reg-input:focus { border-color: var(--blue); box-shadow: 0 0 0 3.5px rgba(37,99,235,.13); background: #fff; }
  .reg-input.is-valid-field   { border-color: #22c55e !important; background: #f0fdf4; }
  .reg-input.is-invalid-field { border-color: var(--red) !important; background: #fff5f5; }
  .field-msg { font-size: .75rem; margin-top: 4px; min-height: 16px; display: block; }
  .field-msg.ok  { color: var(--green); }
  .field-msg.err { color: var(--red); }

  .btn-reg {
    width: 100%;
    background: linear-gradient(135deg, var(--blue), var(--blue-dark));
    color: #fff; padding: .85rem; border-radius: 13px;
    font-weight: 700; font-size: 1rem; border: none; cursor: pointer;
    transition: opacity .2s, transform .1s; box-shadow: 0 4px 14px rgba(37,99,235,.3);
  }
  .btn-reg:hover:not(:disabled)  { opacity: .9; }
  .btn-reg:active:not(:disabled) { transform: scale(.98); }
  .btn-reg:disabled { opacity: .6; cursor: not-allowed; }

  .spinner-sm {
    display: inline-block; width: 15px; height: 15px;
    border: 2px solid rgba(255,255,255,.35); border-top-color: #fff;
    border-radius: 50%; animation: spin .65s linear infinite;
    vertical-align: middle; margin-right: 7px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Locked box ── */
  .locked-box {
    background: var(--blue-soft); border: 1px solid #bfdbfe;
    border-radius: 14px; padding: 16px; text-align: center;
  }
  .locked-box .lk-row { display: flex; justify-content: space-around; margin: 12px 0; }
  .locked-box .lk-val { font-size: 1.6rem; font-weight: 700; color: var(--blue-dark); }
  .locked-box .lk-lbl { font-size: .72rem; color: var(--slate-500); text-transform: uppercase; letter-spacing: .5px; }
  .locked-note { font-size: .82rem; color: var(--slate-500); margin-top: 6px; }
  .locked-sticker {
    width: 120px; height: 120px; object-fit: contain;
    margin: 0 auto 4px; display: block;
    filter: drop-shadow(0 6px 12px rgba(37,99,235,.2));
    animation: stickerPop .4s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes stickerPop { from { opacity:0; transform: scale(.5); } to { opacity:1; transform: scale(1); } }

  /* ── WhatsApp button ── */
  .wa-btn {
    display: inline-flex; align-items: center; gap: 8px;
    margin-top: 14px;
    background: #25d366; color: #fff;
    padding: .7rem 1.2rem; border-radius: 12px;
    font-weight: 700; font-size: .9rem; text-decoration: none;
    box-shadow: 0 4px 14px rgba(37,211,102,.35);
    transition: opacity .2s, transform .1s;
  }
  .wa-btn:hover  { opacity: .9; color: #fff; }
  .wa-btn:active { transform: scale(.97); }

  /* ── Camiseta interactiva ── */
  .shirt-wrap { text-align: center; margin-bottom: 16px; }
  .shirt-svg {
    width: 170px; max-width: 60%; height: auto;
    filter: drop-shadow(0 8px 16px rgba(37,99,235,.25));
  }
  .shirt-caption { font-size: .72rem; color: var(--slate-500); margin-top: 2px; }

  /* ── Cuadrícula de números 0–100 ── */
  .num-legend {
    display: flex; gap: 16px; justify-content: center;
    font-size: .72rem; color: var(--slate-500); margin-bottom: 8px;
  }
  .num-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .lg-dot { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
  .lg-free { background: #bbf7d0; border: 1px solid #86efac; }
  .lg-taken{ background: #fecaca; border: 1px solid #fca5a5; }
  .lg-sel  { background: var(--blue); }

  .num-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(38px, 1fr));
    gap: 6px;
    max-height: 184px; overflow-y: auto;
    padding: 4px; margin-bottom: 6px;
    border: 1.5px solid var(--slate-200); border-radius: 12px;
    background: #f8fafc;
  }
  .num-chip {
    border: 1.5px solid transparent; border-radius: 8px;
    padding: 7px 0; text-align: center;
    font-size: .82rem; font-weight: 600; font-family: 'Sora', sans-serif;
    cursor: pointer; transition: transform .08s, background .15s;
  }
  .num-chip.free     { background: #f0fdf4; color: #14532d; border-color: #bbf7d0; }
  .num-chip.free:hover  { background: #dcfce7; }
  .num-chip.free:active { transform: scale(.92); }
  .num-chip.taken    { background: #fef2f2; color: #b91c1c; border-color: #fecaca; cursor: not-allowed; text-decoration: line-through; opacity: .75; }
  .num-chip.selected { background: var(--blue); color: #fff; border-color: var(--blue-dark); }

  /* ── Opciones de pedido (radio cards) ── */
  .pedido-opts { display: flex; gap: 10px; }
  .pedido-opt {
    flex: 1; cursor: pointer;
    border: 1.5px solid var(--slate-200); border-radius: 12px;
    padding: 12px 10px; text-align: center;
    background: #f8fafc; transition: border-color .15s, background .15s, transform .08s;
  }
  .pedido-opt:hover { border-color: #bfdbfe; }
  .pedido-opt:active { transform: scale(.98); }
  .pedido-opt input { display: none; }
  .pedido-opt .po-icon { font-size: 1.5rem; display: block; margin-bottom: 4px; }
  .pedido-opt .po-text { font-size: .82rem; font-weight: 600; color: var(--slate-800); }
  .pedido-opt.sel { border-color: var(--blue); background: var(--blue-soft); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }

  /* ── Toast ── */
  #toastArea {
    position: fixed; top: 20px; right: 20px; z-index: 9999;
    display: flex; flex-direction: column; gap: 10px; pointer-events: none;
  }
  .toast-item {
    min-width: 280px; max-width: 340px; border-radius: 14px; padding: 14px 18px;
    font-size: .88rem; display: flex; align-items: flex-start; gap: 11px;
    box-shadow: 0 8px 32px rgba(0,0,0,.14); pointer-events: all;
    animation: toastIn .3s cubic-bezier(.34,1.56,.64,1) both;
  }
  .toast-item.hide { animation: toastOut .3s ease forwards; }
  .toast-success { background: #f0fdf4; border: 1.5px solid #86efac; color: #14532d; }
  .toast-error   { background: #fff5f5; border: 1.5px solid #fca5a5; color: #7f1d1d; }
  .toast-warning { background: #fffbeb; border: 1.5px solid #fcd34d; color: #78350f; }
  .toast-icon { font-size: 1.15rem; flex-shrink: 0; margin-top: 1px; }
  .toast-body { flex: 1; line-height: 1.45; }
  .toast-body strong { display: block; font-size: .92rem; margin-bottom: 2px; }
  @keyframes toastIn  { from { opacity:0; transform: translateX(30px) scale(.95); } to { opacity:1; transform: none; } }
  @keyframes toastOut { from { opacity:1; transform: none; } to { opacity:0; transform: translateX(30px) scale(.95); } }

  .modal-content { border: none; border-radius: 20px; }

  /* ── Casillas de observación ── */
  .obs-check {
    display: flex; align-items: center; gap: 9px;
    font-size: .9rem; color: var(--slate-800);
    padding: 9px 12px; margin-bottom: 8px; cursor: pointer;
    border: 1.5px solid var(--slate-200); border-radius: 11px; background: #f8fafc;
    transition: border-color .15s, background .15s;
  }
  .obs-check:hover { border-color: #bfdbfe; background: var(--blue-soft); }
  .obs-check input { width: 18px; height: 18px; accent-color: var(--blue); cursor: pointer; }

  /* ── Overlay de código de 5 dígitos ── */
  #codigoOverlay {
    position: fixed; inset: 0; z-index: 3000;
    background: rgba(15,23,42,.55); backdrop-filter: blur(3px);
    display: none; align-items: center; justify-content: center; padding: 16px;
  }
  #codigoOverlay.show { display: flex; }
  .codigo-card {
    background: #fff; border-radius: 20px; padding: 26px 24px; width: 100%; max-width: 340px;
    box-shadow: 0 20px 50px rgba(0,0,0,.25); text-align: center;
    animation: toastIn .25s ease both;
  }
  .codigo-card h4 { font-size: 1.1rem; font-weight: 700; color: var(--slate-800); margin: 0 0 4px; }
  .codigo-card p  { font-size: .82rem; color: var(--slate-500); margin: 0 0 16px; }
  #codigoInput {
    width: 100%; text-align: center; letter-spacing: .5em;
    font-size: 1.6rem; font-weight: 700; font-family: 'Sora', sans-serif;
    border: 1.5px solid var(--slate-200); border-radius: 12px; padding: .6rem;
    color: var(--slate-800); outline: none; background: #f8fafc;
  }
  #codigoInput:focus { border-color: var(--blue); box-shadow: 0 0 0 3.5px rgba(37,99,235,.13); background: #fff; }
  #codigoMsg { font-size: .78rem; color: var(--red); min-height: 16px; display: block; margin-top: 6px; }
  .codigo-actions { display: flex; gap: 10px; margin-top: 14px; }
  .codigo-actions button { flex: 1; border: none; border-radius: 12px; padding: .7rem; font-weight: 700; cursor: pointer; font-family: 'Sora', sans-serif; }
  #codigoCancel { background: #f1f5f9; color: var(--slate-800); }
  #codigoOk { background: linear-gradient(135deg, var(--blue), var(--blue-dark)); color: #fff; }

  /* ════════════════ 🌌 MODO OSCURO NEÓN ÉPICO 🌌 ════════════════ */
  :root {
    --blue:      #22d3ee;

      radial-gradient(820px 520px at -10% 0%, rgba(34,211,238,.20) 0%, transparent 55%),

  .wrap { position: relative; z-index: 1; }

  .page-head {
    background: rgba(17,18,38,.72);

  .search-box { background: rgba(17,18,38,.7); color: var(--slate-800); border-color: rgba(124,131,255,.22); }

  .person { background: rgba(17,18,38,.65); border-color: rgba(124,131,255,.18); backdrop-filter: blur(6px); }

  .reg-input:focus, #codigoInput:focus { border-color: #22d3ee; background: rgba(10,11,26,.95); box-shadow: 0 0 0 3px rgba(34,211,238,.22), 0 0 16px rgba(34,211,238,.3); }
  .reg-input.is-valid-field   { border-color: #34d399 !important; background: rgba(52,211,153,.10) !important; }

  .btn-reg { background: linear-gradient(135deg, #22d3ee, #d946ef); color: #06060f; box-shadow: 0 0 22px rgba(34,211,238,.5); }

  .locked-box { background: rgba(34,211,238,.07); border: 1px solid rgba(34,211,238,.3); }

<body>

<div id="toastArea"></div>

<!-- Overlay para el código de 5 dígitos -->

<script type="module">

let participantes = [];
let sexosMap = {};
let modalSexoId = null;
let modalRegistroId = null;
let edicionHabilitada = false;
let codigoActual = null;
let modalBs;
const WHATSAPP_ADMIN = '593967549140'; // sin el "+"

/* ── Toast ── */
function toast(type, title, body = '', duration = 4500) {
  const icons = { success:'✅', error:'❌', warning:'⚠️', info:'ℹ️' };
  const area  = document.getElementById('toastArea');
  const el = document.createElement('div');
  el.className = `toast-item toast-${type}`;
  el.innerHTML = `
    <span class="toast-icon">${icons[type]}</span>
    <div class="toast-body"><strong>${title}</strong>${body || ''}</div>`;
  area.appendChild(el);
  setTimeout(() => { el.classList.add('hide'); setTimeout(() => el.remove(), 320); }, duration);
}

/* ── Escape para evitar romper el HTML ── */
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

/* ── Cargar datos: solo participantes (participa = true) ── */
async function cargar() {
  const [{ data: evs }, { data: sxs }, { data: cfg }, { data: regs, error }] = await Promise.all([
    window.supabase.from('eventos').select('*'),
    window.supabase.from('sexos').select('*'),
    window.supabase.from('config').select('*').eq('clave', 'edicion_habilitada').maybeSingle(),
    window.supabase.from('registro_eventos').select('*').eq('participa', true).order('nombre_apellido')
  ]);

  if (error) { toast('error', 'No se pudo cargar', error.message); return; }

  edicionHabilitada = (cfg?.valor === 'true');
  const eventosMap = {};
  (evs || []).forEach(e => eventosMap[e.id] = e.nombre);
  sexosMap = {};
  (sxs || []).forEach(s => sexosMap[s.id] = s.nombre);
  participantes = (regs || []).map(r => ({ ...r, evento_nombre: eventosMap[r.evento_id] || '—' }));
  poblarFiltroCurso();
  actualizarProgreso();
  render();
  renderGrid(); // refresca la cuadrícula si el modal está abierto
}

/* ── Llenar el filtro de cursos dinámicamente (se llena solo con los cursos que existan) ── */
function poblarFiltroCurso() {
  const sel = document.getElementById('filtroCurso');
  const actual = sel.value; // preservar selección
  const cursos = [...new Set(participantes.map(p => (p.curso || '').trim()).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b, 'es'));

  sel.innerHTML = '<option value="">Todos los cursos</option>' +
    cursos.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');

  // restaurar selección si sigue existiendo
  if (cursos.includes(actual)) sel.value = actual;
}

/* ── Contador de progreso (sobre el total, no el filtrado por búsqueda) ── */
function actualizarProgreso() {
  const total    = participantes.length;
  const enviados = participantes.filter(p => p.uniforme_at).length;
  const pct      = total ? Math.round((enviados / total) * 100) : 0;

  document.getElementById('progFill').style.width = pct + '%';
  const texto = document.getElementById('progTexto');
  texto.innerHTML = total
    ? `<strong>${enviados}</strong> de <strong>${total}</strong> ya enviaron sus datos · ${pct}%`
    : 'Aún no hay participantes registrados.';
}

/* ── Render lista ── */
function render() {
  const q = document.getElementById('buscar').value.trim().toLowerCase();
  const cursoFil = document.getElementById('filtroCurso').value;
  const lista = document.getElementById('lista');

  const filtrados = participantes.filter(r => {
    const matchTexto = !q || r.nombre_apellido.toLowerCase().includes(q) || (r.curso || '').toLowerCase().includes(q);
    const matchCurso = !cursoFil || (r.curso || '').trim() === cursoFil;
    return matchTexto && matchCurso;
  });

  if (filtrados.length === 0) {
    lista.innerHTML = `<div class="empty">No se encontraron participantes.</div>`;
    return;
  }

  lista.innerHTML = filtrados.map(r => {
    const hecho = !!r.uniforme_at;
    const badge = hecho
      ? `<span class="badge-state badge-done">✓ Enviado</span>`
      : `<span class="badge-state badge-pend">Pendiente</span>`;
    return `
      <div class="person" data-id="${r.id}">
        <div class="avatar">${esc(r.nombre_apellido.charAt(0).toUpperCase())}</div>
        <div class="person-info">
          <div class="person-name">${esc(r.nombre_apellido)}</div>
          <div class="person-sub">${esc(r.curso)} · ${esc(r.evento_nombre)}</div>
        </div>
        ${badge}
      </div>`;
  }).join('');

  lista.querySelectorAll('.person').forEach(el =>
    el.addEventListener('click', () => abrirModal(Number(el.dataset.id))));
}

/* ── Camiseta SVG ── */
function shirtSVG() {
  return `
    <div class="shirt-wrap">
      <svg viewBox="0 0 200 210" class="shirt-svg" aria-hidden="true">
        <defs>
          <linearGradient id="jersey" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#3b82f6"/>
            <stop offset="1" stop-color="#1d4ed8"/>
          </linearGradient>
        </defs>
        <path d="M75,30 C82,42 118,42 125,30 L152,40 L182,72 L162,100 L142,90 L142,188 L58,188 L58,90 L38,100 L18,72 L48,40 Z"
              fill="url(#jersey)" stroke="#1e40af" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M75,30 C82,42 118,42 125,30 L118,30 C112,38 88,38 82,30 Z" fill="#1e3a8a"/>
        <text id="shirtName"   x="100" y="78"  text-anchor="middle" fill="#ffffff" font-family="Sora, sans-serif" font-weight="700" font-size="15" letter-spacing="1"></text>
        <text id="shirtNumber" x="100" y="158" text-anchor="middle" fill="#ffffff" font-family="Sora, sans-serif" font-weight="800" font-size="68"></text>
      </svg>
      <div class="shirt-caption">Vista previa de tu camiseta</div>
    </div>`;
}

function actualizarShirt() {
  const nombre = (document.getElementById('inpNombre')?.value || '').trim().toUpperCase().slice(0, 14);
  const num    = (document.getElementById('inpCamisa')?.value || '').trim().toUpperCase().slice(0, 3);
  const tName = document.getElementById('shirtName');
  const tNum  = document.getElementById('shirtNumber');
  if (tName) tName.textContent = nombre;
  if (tNum)  tNum.textContent  = num;
}

/* ── Números de camisa ocupados (set normalizado) ── */
function normNum(v) { return String(v ?? '').trim().toLowerCase(); }

function numerosOcupados() {
  // Ocupados SOLO dentro del mismo sexo del participante del modal
  const set = new Set();
  participantes.forEach(p => {
    if (p.sexo_id !== modalSexoId) return;
    if (p.id === modalRegistroId) return; // no contar el número propio
    const n = normNum(p.numero_camisa);
    if (n) set.add(n);
  });
  return set;
}

/* ── Cuadrícula de números 0–100 ── */
function renderGrid() {
  const grid = document.getElementById('numGrid');
  if (!grid) return;
  const ocupados = numerosOcupados();
  const sel = normNum(document.getElementById('inpCamisa')?.value);

  const lbl = document.getElementById('numSexoLabel');
  if (lbl) {
    const nombreSexo = sexosMap[modalSexoId];
    lbl.textContent = nombreSexo ? `Números para ${nombreSexo}` : 'Números disponibles';
  }

  let html = '';
  for (let n = 0; n <= 100; n++) {
    const key = String(n);
    const taken = ocupados.has(key);
    const isSel = !taken && sel === key;
    const cls = taken ? 'taken' : (isSel ? 'free selected' : 'free');
    html += `<div class="num-chip ${cls}" data-n="${key}" title="${taken ? 'Ocupado' : 'Disponible'}">${n}</div>`;
  }
  grid.innerHTML = html;

  grid.querySelectorAll('.num-chip.free').forEach(chip =>
    chip.addEventListener('click', () => {
      const inp = document.getElementById('inpCamisa');
      inp.value = chip.dataset.n;
      actualizarShirt();
      validar('inpCamisa', 'msgCamisa');
      renderGrid();
    }));
}

/* ── Pedir código de 5 dígitos (Promise) ── */
function pedirCodigo(titulo = 'Confirma tu identidad') {
  return new Promise(resolve => {
    const ov  = document.getElementById('codigoOverlay');
    const inp = document.getElementById('codigoInput');
    const msg = document.getElementById('codigoMsg');
    const btnOk = document.getElementById('codigoOk');
    const btnNo = document.getElementById('codigoCancel');
    document.getElementById('codigoTitulo').textContent = titulo;
    inp.value = ''; msg.textContent = '';
    ov.classList.add('show');
    setTimeout(() => inp.focus(), 50);

    const cerrar = (val) => {
      ov.classList.remove('show');
      btnOk.onclick = null; btnNo.onclick = null; inp.onkeydown = null; inp.oninput = null;
      resolve(val);
    };
    inp.oninput = () => { inp.value = inp.value.replace(/\D/g, '').slice(0, 5); };
    const confirmar = () => {
      const v = inp.value.trim();
      if (!/^\d{5}$/.test(v)) { msg.textContent = 'Debe ser un código de 5 dígitos.'; return; }
      cerrar(v);
    };
    btnOk.onclick = confirmar;
    btnNo.onclick = () => cerrar(null);
    inp.onkeydown = (e) => { if (e.key === 'Enter') confirmar(); };
  });
}

/* ── Abrir modal ── */
async function abrirModal(id) {
  const r = participantes.find(p => p.id === id);
  if (!r) return;

  modalSexoId = r.sexo_id;
  modalRegistroId = r.id;
  codigoActual = null;
  document.getElementById('modalTitulo').textContent = r.nombre_apellido;

  if (r.uniforme_at) {
    if (!edicionHabilitada) { mostrarYaEnviado(r); return; }
    // Edición habilitada: pedir código para desbloquear
    const code = await pedirCodigo('Ingresa tu código para editar');
    if (!code) return;
    const { data: ok, error } = await window.supabase.rpc('verificar_codigo', { p_id: id, p_token: code });
    if (error || !ok) { toast('error', 'Código incorrecto', 'Ese código no corresponde a este registro.', 5000); return; }
    codigoActual = code;
    abrirFormulario(r, true);
    return;
  }
  abrirFormulario(r, false);
}

/* ── Modal "ya enviado" (secreto) ── */

          Escribir por WhatsApp
        </a>
      </div>`;
  modalBs.show();
}

/* ── Formulario (llenar o editar) ── */
function abrirFormulario(r, esEdicion) {
  const body = document.getElementById('modalBody');
  body.innerHTML = `
    ${shirtSVG()}
    <div class="mb-3">
      <label class="reg-label" for="inpNombre">Nombre en la camisa</label>
      <input id="inpNombre" class="reg-input" maxlength="14" placeholder="Ej: Juan" autocomplete="off">
      <span class="field-msg" id="msgNombre"></span>
    </div>
    <div class="mb-3">
      <label class="reg-label" for="inpCamisa">Número de camisa</label>
      <input id="inpCamisa" class="reg-input" maxlength="3" inputmode="numeric" placeholder="Toca un número disponible abajo" autocomplete="off">
      <span class="field-msg" id="msgCamisa"></span>
      <div id="numSexoLabel" style="text-align:center;font-size:.78rem;font-weight:700;color:var(--blue-dark);margin-top:8px;"></div>
      <div class="num-legend" style="margin-top:6px;">
        <span><i class="lg-dot lg-free"></i> Disponible</span>
        <span><i class="lg-dot lg-taken"></i> Ocupado</span>
        <span><i class="lg-dot lg-sel"></i> Tu número</span>
      </div>
      <div class="num-grid" id="numGrid"></div>
    </div>
    <div class="mb-3">
      <label class="reg-label" for="inpTalla">Talla del uniforme</label>
      <input id="inpTalla" class="reg-input" maxlength="20" placeholder="Ej: M, 38, Large" autocomplete="off">
      <span class="field-msg" id="msgTalla"></span>
    </div>
    <div class="mb-3">
      <label class="reg-label">¿Qué vas a mandar a hacer?</label>
      <div class="pedido-opts">
        <label class="pedido-opt" data-val="Equipo completo">
          <input type="radio" name="tipoPedido" value="Equipo completo">
          <span class="po-icon">👕🩳</span>
          <span class="po-text">Equipo completo</span>
        </label>
        <label class="pedido-opt" data-val="Solo camisa">
          <input type="radio" name="tipoPedido" value="Solo camisa">
          <span class="po-icon">👕</span>
          <span class="po-text">Solo camisa</span>
        </label>
      </div>
      <span class="field-msg" id="msgPedido"></span>
    </div>
    <div class="mb-3">
      <label class="reg-label">Observaciones</label>
      <label class="obs-check"><input type="checkbox" id="inpSinNumero"> No quiero <strong>número</strong> en mi camisa</label>
      <label class="obs-check"><input type="checkbox" id="inpSinNombre"> No quiero <strong>nombre</strong> en mi camisa</label>
      <textarea id="inpObservacion" class="reg-input" rows="2" maxlength="120" placeholder="Observación (opcional)" style="resize:none;margin-top:8px;"></textarea>
    </div>
    <p style="font-size:.78rem;color:var(--slate-500);margin-bottom:14px;">
      🔒 Al ${esEdicion ? 'guardar' : 'enviar'} te pediremos tu <strong>código de 5 dígitos</strong>${esEdicion ? '' : ' y tus datos quedarán bloqueados'}.
    </p>
    <button class="btn-reg" id="btnGuardar">${esEdicion ? 'Guardar cambios' : 'Enviar'}</button>`;

  // Precargar si es edición
  if (esEdicion) {
    document.getElementById('inpNombre').value = r.nombre_camisa || '';
    document.getElementById('inpCamisa').value = r.numero_camisa || '';
    document.getElementById('inpTalla').value  = r.talla || '';
    document.getElementById('inpObservacion').value = r.observacion || '';
    document.getElementById('inpSinNumero').checked = !!r.sin_numero;
    document.getElementById('inpSinNombre').checked = !!r.sin_nombre;
    if (r.tipo_pedido) {
      const opt = [...document.querySelectorAll('.pedido-opt')].find(o => o.dataset.val === r.tipo_pedido);
      if (opt) { opt.classList.add('sel'); opt.querySelector('input').checked = true; }
    }
  }

  document.getElementById('inpNombre').addEventListener('input', actualizarShirt);
  document.getElementById('inpCamisa').addEventListener('input', () => {
    const inp = document.getElementById('inpCamisa');
    inp.value = inp.value.replace(/\D/g, '').slice(0, 3);
    actualizarShirt();
    renderGrid();
  });
  document.querySelectorAll('.pedido-opt').forEach(opt =>
    opt.addEventListener('click', () => {
      document.querySelectorAll('.pedido-opt').forEach(o => o.classList.remove('sel'));

  document.getElementById('inpSinNombre').addEventListener('change', aplicarSinNombre);

  document.getElementById('btnGuardar').addEventListener('click', () => guardar(r.id));

/* ── Casillas "sin número" / "sin nombre" ── */
function aplicarSinNumero() {
  const chk = document.getElementById('inpSinNumero').checked;
  const inp = document.getElementById('inpCamisa');
  inp.disabled = chk;
  if (chk) { inp.value = ''; inp.classList.remove('is-invalid-field','is-valid-field'); document.getElementById('msgCamisa').textContent = ''; }
  document.getElementById('numGrid').style.display = chk ? 'none' : '';
  document.getElementById('numSexoLabel').style.display = chk ? 'none' : '';
  const lg = document.querySelector('.num-legend'); if (lg) lg.style.display = chk ? 'none' : '';
  actualizarShirt();
}
function aplicarSinNombre() {
  const chk = document.getElementById('inpSinNombre').checked;
  const inp = document.getElementById('inpNombre');
  inp.disabled = chk;
  if (chk) { inp.value = ''; inp.classList.remove('is-invalid-field','is-valid-field'); document.getElementById('msgNombre').textContent = ''; }
  actualizarShirt();
}

/* ── Validación simple de no-vacío ── */
function validar(inpId, msgId) {
  const el = document.getElementById(inpId);
  const msg = document.getElementById(msgId);
  const ok = el.value.trim() !== '';
  el.classList.toggle('is-valid-field', ok);
  el.classList.toggle('is-invalid-field', !ok);
  msg.textContent = ok ? '✓ Correcto' : 'Este campo es obligatorio.';
  msg.className = 'field-msg ' + (ok ? 'ok' : 'err');
  return ok;
}

/* ── Guardar (con código de propiedad) ── */
async function guardar(id) {
  const sinNumero = document.getElementById('inpSinNumero').checked;
  const sinNombre = document.getElementById('inpSinNombre').checked;

  // Validación condicional
  const okN = sinNombre ? true : validar('inpNombre', 'msgNombre');
  const okC = sinNumero ? true : validar('inpCamisa', 'msgCamisa');
  const okT = validar('inpTalla', 'msgTalla');
  const pedidoSel = document.querySelector('input[name="tipoPedido"]:checked');
  const okP = !!pedidoSel;
  const msgP = document.getElementById('msgPedido');
  msgP.textContent = okP ? '✓ Correcto' : 'Elige una opción.';
  msgP.className = 'field-msg ' + (okP ? 'ok' : 'err');
  if (!okN || !okC || !okT || !okP) { toast('warning', 'Faltan datos', 'Completa los campos obligatorios.'); return; }

  const nombreCamisa = sinNombre ? '' : document.getElementById('inpNombre').value.trim();
  const camisa       = sinNumero ? '' : document.getElementById('inpCamisa').value.trim();
  const talla        = document.getElementById('inpTalla').value.trim();
  const observacion  = document.getElementById('inpObservacion').value.trim();
  const tipoPedido   = pedidoSel.value;

  // Chequeo local de número ocupado (por sexo, excluyendo el propio) salvo "sin número"
  if (!sinNumero && numerosOcupados().has(normNum(camisa))) {
    document.getElementById('msgCamisa').textContent = 'Ese número ya está ocupado. Elige otro.';
    document.getElementById('msgCamisa').className = 'field-msg err';
    document.getElementById('inpCamisa').classList.add('is-invalid-field');
    toast('warning', 'Número ocupado', `El número ${esc(camisa)} ya fue tomado. Elige otro disponible.`, 6000);
    return;
  }

  // Pedir el código de propiedad (si no se capturó al desbloquear la edición)
  let code = codigoActual;
  if (!code) {
    // Ocultar el formulario para que Bootstrap no robe el foco del input del código
    modalBs.hide();
    await new Promise(res => setTimeout(res, 250));
    code = await pedirCodigo('Confirma tu identidad');
    if (!code) { modalBs.show(); return; }
    modalBs.show();
    await new Promise(res => setTimeout(res, 200));
  }

  const btn = document.getElementById('btnGuardar');
  const txtBtn = btn.textContent;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-sm"></span>Guardando…';

  const { error } = await window.supabase.rpc('guardar_uniforme_token', {
    p_id: id, p_token: code,
    p_numero: camisa, p_talla: talla, p_nombre: nombreCamisa, p_pedido: tipoPedido,
    p_sin_numero: sinNumero, p_sin_nombre: sinNombre, p_observacion: observacion
  });

  if (error) {
    const m = (error.message || '').toLowerCase();
    if (error.code === '23505' || m.includes('duplicate')) {
      toast('error', 'Número ocupado', `El número ${esc(camisa)} acaba de ser tomado por otra persona. Elige otro.`, 7000);
      codigoActual = code; await cargar(); renderGrid();
    } else if (m.includes('código') || m.includes('codigo')) {
      toast('error', 'Código incorrecto', 'El código de 5 dígitos no es válido.', 6000);
      codigoActual = null;
    } else if (m.includes('deshabilitada')) {
      toast('error', 'Edición deshabilitada', 'El administrador no tiene habilitada la edición.', 6000);
    } else {
      toast('error', 'No se pudo guardar', error.message, 6000);
    }
    btn.disabled = false; btn.innerHTML = txtBtn;
    return;
  }

  toast('success', '¡Datos guardados!', 'Tu información quedó registrada correctamente.', 6000);
  modalBs.hide();
  await cargar();
}

/* ── Init ── */
document.getElementById('buscar').addEventListener('input', render);
document.getElementById('filtroCurso').addEventListener('change', render);

window.addEventListener('DOMContentLoaded', async () => {
  modalBs = new bootstrap.Modal(document.getElementById('modalUniforme'), { focus: false });
  await cargar();

  // Tiempo real: si alguien guarda, refresca la lista.
  window.supabase
    .channel('uniformes_realtime')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'registro_eventos' }, cargar)
    .subscribe();
});
</script>
