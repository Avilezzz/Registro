<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración | Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Poppins', 'sans-serif'],
            mono: ['Fira Code', 'monospace'],
          },
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0ea5e9',
              600: '#0284c7',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Transiciones para Modal y Toast */
    .modal-active {
      opacity: 1 !important;
      pointer-events: auto !important;
    }
    .modal-active > div {
      transform: scale(1) !important;
      opacity: 1 !important;
    }
    
    .toast-active {
      transform: translateY(0) !important;
      opacity: 1 !important;
    }

    /* Scrollbar personalizado para la tabla */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>

<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

  <header class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="bg-brand-600 text-white p-2 rounded-lg">
          <i class="bi bi-lightning-charge-fill text-lg"></i>
        </div>
        <h1 class="font-bold text-lg tracking-tight text-slate-900">Panel Administrativo</h1>
      </div>
      <div class="flex items-center gap-2 bg-emerald-50 px-3 py-1.5 rounded-full border border-emerald-200">
        <span class="relative flex h-2.5 w-2.5">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
        </span>
        <span class="text-xs font-semibold text-emerald-700 tracking-wide uppercase font-mono">En Vivo</span>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
      <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm relative overflow-hidden group hover:shadow-md transition-shadow">
        <div class="absolute right-0 top-0 h-full w-2 bg-brand-500 rounded-r-2xl"></div>
        <div class="flex justify-between items-start">
          <div>
            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Total Inscritos</p>
            <h3 class="text-4xl font-black text-slate-800 font-mono" id="statTotal">0</h3>
          </div>
          <div class="bg-brand-50 p-3 rounded-xl text-brand-600 group-hover:scale-110 transition-transform">
            <i class="bi bi-people text-2xl"></i>
          </div>
        </div>
      </div>
      
      <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm relative overflow-hidden group hover:shadow-md transition-shadow">
        <div class="absolute right-0 top-0 h-full w-2 bg-emerald-500 rounded-r-2xl"></div>
        <div class="flex justify-between items-start">
          <div>
            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Participan</p>
            <h3 class="text-4xl font-black text-slate-800 font-mono" id="statSi">0</h3>
          </div>
          <div class="bg-emerald-50 p-3 rounded-xl text-emerald-600 group-hover:scale-110 transition-transform">
            <i class="bi bi-person-check text-2xl"></i>
          </div>
        </div>
      </div>

      <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm relative overflow-hidden group hover:shadow-md transition-shadow">
        <div class="absolute right-0 top-0 h-full w-2 bg-slate-400 rounded-r-2xl"></div>
        <div class="flex justify-between items-start">
          <div>
            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">No Participan</p>
            <h3 class="text-4xl font-black text-slate-800 font-mono" id="statNo">0</h3>
          </div>
          <div class="bg-slate-100 p-3 rounded-xl text-slate-600 group-hover:scale-110 transition-transform">
            <i class="bi bi-person-dash text-2xl"></i>
          </div>
        </div>
      </div>

      <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm relative overflow-hidden group hover:shadow-md transition-shadow">
        <div class="absolute right-0 top-0 h-full w-2 bg-purple-500 rounded-r-2xl"></div>
        <div class="flex justify-between items-start">
          <div>
            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Eventos Activos</p>
            <h3 class="text-4xl font-black text-slate-800 font-mono" id="statEventos">0</h3>
          </div>
          <div class="bg-purple-50 p-3 rounded-xl text-purple-600 group-hover:scale-110 transition-transform">
            <i class="bi bi-calendar-event text-2xl"></i>
          </div>
        </div>
      </div>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 mb-6 flex flex-col md:flex-row gap-4 items-center justify-between">
      
      <div class="flex flex-col sm:flex-row gap-3 w-full md:w-auto flex-1">
        <div class="relative flex-1 sm:max-w-xs">
          <i class="bi bi-search absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
          <input type="text" id="buscar" placeholder="Buscar participante..." 
            class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition-all">
        </div>
        
        <div class="relative flex-1 sm:max-w-xs">
          <i class="bi bi-funnel absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
          <select id="filtroEvento" class="w-full pl-10 pr-8 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm appearance-none focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition-all cursor-pointer">
            <option value="">Todos los eventos</option>
          </select>
          <i class="bi bi-chevron-down absolute right-3 top-1/2 transform -translate-y-1/2 text-slate-400 text-xs pointer-events-none"></i>
        </div>

        <div class="relative flex-1 sm:max-w-xs">
          <i class="bi bi-check-circle absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
          <select id="filtroParticipa" class="w-full pl-10 pr-8 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm appearance-none focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition-all cursor-pointer">
            <option value="">Cualquier estado</option>
            <option value="si">Participan</option>
            <option value="no">No participan</option>
          </select>
          <i class="bi bi-chevron-down absolute right-3 top-1/2 transform -translate-y-1/2 text-slate-400 text-xs pointer-events-none"></i>
        </div>
      </div>

      <div class="flex gap-3 w-full md:w-auto shrink-0">
        <button id="btnPdf" class="flex-1 md:flex-none flex items-center justify-center gap-2 bg-rose-600 hover:bg-rose-700 text-white px-5 py-2.5 rounded-xl text-sm font-semibold shadow-sm shadow-rose-200 transition-all active:scale-95">
          <i class="bi bi-file-earmark-pdf"></i> PDF
        </button>
        <button id="btnXls" class="flex-1 md:flex-none flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl text-sm font-semibold shadow-sm shadow-emerald-200 transition-all active:scale-95">
          <i class="bi bi-file-earmark-excel"></i> Excel
        </button>
      </div>

    </div>

    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse min-w-[800px]">
          <thead>
            <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 text-xs uppercase tracking-wider font-semibold">
              <th class="px-6 py-4">#</th>
              <th class="px-6 py-4">Participante</th>
              <th class="px-6 py-4">Curso</th>
              <th class="px-6 py-4">Evento</th>
              <th class="px-6 py-4">Estado</th>
              <th class="px-6 py-4 hidden md:table-cell">Fecha</th>
              <th class="px-6 py-4 text-center">Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla" class="divide-y divide-slate-100">
            </tbody>
        </table>
      </div>
    </div>

  </main>

  <div id="modal-overlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6 mx-4 transform scale-95 opacity-0 transition-all duration-300">
      
      <div class="w-12 h-12 rounded-full bg-red-100 flex items-center justify-center mb-4 mx-auto">
        <i class="bi bi-exclamation-triangle text-2xl text-red-600"></i>
      </div>
      
      <h3 class="text-xl font-bold text-center text-slate-800 mb-2">¿Eliminar registro?</h3>
      <p class="text-center text-slate-500 text-sm mb-6">Esta acción es irreversible. El participante será eliminado permanentemente del sistema.</p>
      
      <div class="flex gap-3">
        <button id="btnCancelar" class="flex-1 bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 px-4 py-2.5 rounded-xl font-semibold transition-colors">
          Cancelar
        </button>
        <button id="btnConfirmarEliminar" class="flex-1 bg-red-600 hover:bg-red-700 text-white px-4 py-2.5 rounded-xl font-semibold shadow-sm shadow-red-200 transition-colors flex justify-center items-center gap-2">
          <i class="bi bi-trash"></i> Eliminar
        </button>
      </div>
    </div>
  </div>

  <div id="toast" class="fixed bottom-6 right-6 bg-slate-800 text-white px-5 py-3 rounded-xl shadow-lg flex items-center gap-3 transform translate-y-20 opacity-0 transition-all duration-300 z-50 font-medium">
    <i id="toast-icon" class="bi bi-info-circle text-brand-400 text-lg"></i>
    <span id="toast-msg">Notificación</span>
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const supabase = createClient(
      "https://mdcayyifejqfvvoiphmi.supabase.co",
      "sb_publishable_lEzIrscGXzVAJ-c00FT2GQ_BMuHsVmK"
    );

    /* ── State ── */
    let todos        = [];
    let eventosMap   = {};
    let pendingDeleteId = null;

    /* ── Toast ── */
    function toast(msg, iconClass = "bi-check-circle", ms = 3000) {
      const el = document.getElementById("toast");
      const icon = document.getElementById("toast-icon");
      const text = document.getElementById("toast-msg");
      
      icon.className = `bi ${iconClass} text-brand-400 text-lg`;
      text.textContent = msg;
      
      el.classList.add("toast-active");
      setTimeout(() => el.classList.remove("toast-active"), ms);
    }

    /* ── Cargar eventos ── */
    async function cargarEventos() {
      const { data } = await supabase.from("eventos").select("*").order("nombre");
      if (!data) return;

      eventosMap = {};
      data.forEach(e => eventosMap[e.id] = e.nombre);

      document.getElementById("statEventos").textContent = data.length;

      const sel = document.getElementById("filtroEvento");
      sel.innerHTML = '<option value="">Todos los eventos</option>';
      data.forEach(e => {
        const opt = document.createElement("option");
        opt.value = e.id;
        opt.textContent = e.nombre;
        sel.appendChild(opt);
      });
    }

    /* ── Cargar participantes ── */
    async function cargarDatos() {
      const { data, error } = await supabase
        .from("registro_eventos")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) { console.error(error); return; }

      todos = (data || []).map(r => ({
        ...r,
        evento_nombre: eventosMap[r.evento_id] || "—"
      }));

      renderizar();
    }

    /* ── Filtrar + renderizar ── */
    function renderizar() {
      const buscar     = document.getElementById("buscar").value.toLowerCase();
      const eventoFil  = document.getElementById("filtroEvento").value;
      const participaFil = document.getElementById("filtroParticipa").value;

      const filtrados = todos.filter(r => {
        const matchTexto = !buscar ||
          r.nombre_apellido.toLowerCase().includes(buscar) ||
          r.curso.toLowerCase().includes(buscar);

        const matchEvento = !eventoFil || String(r.evento_id) === String(eventoFil);
        const matchParticipa = !participaFil ||
          (participaFil === "si" && r.participa) ||
          (participaFil === "no" && !r.participa);

        return matchTexto && matchEvento && matchParticipa;
      });

      /* Stats */
      document.getElementById("statTotal").textContent = todos.length;
      document.getElementById("statSi").textContent    = todos.filter(r => r.participa).length;
      document.getElementById("statNo").textContent    = todos.filter(r => !r.participa).length;

      const tbody = document.getElementById("tabla");

      if (filtrados.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" class="px-6 py-16 text-center text-slate-400">
              <i class="bi bi-inbox text-5xl mb-3 block opacity-50"></i>
              <p class="font-medium">No se encontraron resultados</p>
              <p class="text-sm mt-1">Intenta ajustando los filtros de búsqueda</p>
            </td>
          </tr>`;
        return;
      }

      tbody.innerHTML = filtrados.map((r, i) => `
        <tr class="hover:bg-slate-50 transition-colors group">
          <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-400 font-mono">${i + 1}</td>
          <td class="px-6 py-4 whitespace-nowrap">
            <div class="flex items-center">
              <div class="h-8 w-8 rounded-full bg-brand-100 text-brand-600 flex items-center justify-center font-bold text-xs mr-3">
                ${r.nombre_apellido.charAt(0).toUpperCase()}
              </div>
              <span class="font-semibold text-slate-800">${r.nombre_apellido}</span>
            </div>
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-600">${r.curso}</td>
          <td class="px-6 py-4 whitespace-nowrap">
            <span class="inline-flex items-center px-2.5 py-1 rounded-md text-xs font-medium bg-slate-100 text-slate-700 border border-slate-200">
              <i class="bi bi-calendar2-event mr-1.5 opacity-60"></i> ${r.evento_nombre}
            </span>
          </td>
          <td class="px-6 py-4 whitespace-nowrap">
            ${r.participa 
              ? `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-100 text-emerald-700 border border-emerald-200">
                   <i class="bi bi-check2-circle mr-1 text-sm"></i> Sí participa
                 </span>` 
              : `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-500 border border-slate-200">
                   <i class="bi bi-x-circle mr-1 text-sm"></i> No participa
                 </span>`
            }
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-xs text-slate-500 font-mono hidden md:table-cell">
            ${new Date(r.created_at).toLocaleString("es-EC", { day:"2-digit", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" })}
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-center">
            <div class="flex items-center justify-center gap-2 opacity-80 group-hover:opacity-100 transition-opacity">
              <a href="${r.whatsapp_link}" target="_blank" class="p-2 text-emerald-600 bg-emerald-50 hover:bg-emerald-100 rounded-lg transition-colors tooltip" title="WhatsApp">
                <i class="bi bi-whatsapp"></i>
              </a>
              <button onclick="pedirEliminar(${r.id})" class="p-2 text-rose-600 bg-rose-50 hover:bg-rose-100 rounded-lg transition-colors tooltip" title="Eliminar">
                <i class="bi bi-trash3"></i>
              </button>
            </div>
          </td>
        </tr>
      `).join("");
    }

    /* ── Eliminar Modal Logic ── */
    window.pedirEliminar = function(id) {
      pendingDeleteId = id;
      document.getElementById("modal-overlay").classList.add("modal-active");
    };

    document.getElementById("btnCancelar").addEventListener("click", () => {
      pendingDeleteId = null;
      document.getElementById("modal-overlay").classList.remove("modal-active");
    });

    document.getElementById("btnConfirmarEliminar").addEventListener("click", async () => {
      if (!pendingDeleteId) return;
      
      const btn = document.getElementById("btnConfirmarEliminar");
      btn.innerHTML = '<i class="bi bi-hourglass-split animate-spin"></i> Eliminando...';
      btn.disabled = true;

      const { error } = await supabase
        .from("registro_eventos")
        .delete()
        .eq("id", pendingDeleteId);

      document.getElementById("modal-overlay").classList.remove("modal-active");
      pendingDeleteId = null;
      
      btn.innerHTML = '<i class="bi bi-trash"></i> Eliminar';
      btn.disabled = false;

      if (error) { toast("Error al eliminar el registro", "bi-x-circle text-rose-400"); return; }
      toast("Registro eliminado exitosamente", "bi-check-circle text-emerald-400");
      await cargarDatos();
    });

    /* ── Filtros reactivos ── */
    ["buscar","filtroEvento","filtroParticipa"].forEach(id => {
      document.getElementById(id).addEventListener("input", renderizar);
      document.getElementById(id).addEventListener("change", renderizar);
    });

    /* ── Helper Export ── */
    function getFiltered() {
      const buscar       = document.getElementById("buscar").value.toLowerCase();
      const eventoFil    = document.getElementById("filtroEvento").value;
      const participaFil = document.getElementById("filtroParticipa").value;

      return todos.filter(r => {
        const matchTexto = !buscar || r.nombre_apellido.toLowerCase().includes(buscar) || r.curso.toLowerCase().includes(buscar);
        const matchEvento = !eventoFil || String(r.evento_id) === String(eventoFil);
        const matchParticipa = !participaFil || (participaFil === "si" && r.participa) || (participaFil === "no" && !r.participa);
        return matchTexto && matchEvento && matchParticipa;
      });
    }

    /* ── PDF ── */
    document.getElementById("btnPdf").addEventListener("click", () => {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: "landscape" });

      doc.setFont("helvetica","bold");
      doc.setFontSize(16);
      doc.text("LISTADO DE PARTICIPANTES", 14, 18);

      doc.setFont("helvetica","normal");
      doc.setFontSize(9);
      doc.setTextColor(120);
      doc.text(`Generado: ${new Date().toLocaleString("es-EC")}`, 14, 25);

      const visibles = getFiltered();

      doc.autoTable({
        startY: 32,
        styles: { font: "helvetica", fontSize: 8, cellPadding: 4 },
        headStyles: { fillColor: [14, 165, 233], textColor: 255, fontStyle: 'bold' }, /* Brand Color */
        alternateRowStyles: { fillColor: [248, 250, 252] },
        head: [["#","NOMBRE","CURSO","EVENTO","PARTICIPA","FECHA"]],
        body: visibles.map((r, i) => [
          i + 1,
          r.nombre_apellido,
          r.curso,
          r.evento_nombre,
          r.participa ? "SÍ" : "NO",
          new Date(r.created_at).toLocaleString("es-EC")
        ])
      });

      doc.save("Listado_Participantes.pdf");
      toast("PDF descargado", "bi-file-earmark-pdf text-rose-400");
    });

    /* ── Excel ── */
    document.getElementById("btnXls").addEventListener("click", () => {
      const visibles = getFiltered();
      const ws = XLSX.utils.json_to_sheet(visibles.map((r, i) => ({
        "#":          i + 1,
        "Nombre":     r.nombre_apellido,
        "Curso":      r.curso,
        "Evento":     r.evento_nombre,
        "Participa":  r.participa ? "SÍ" : "NO",
        "Teléfono":   r.telefono,
        "Fecha":      new Date(r.created_at).toLocaleString("es-EC"),
        "WhatsApp":   r.whatsapp_link
      })));

      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Participantes");
      XLSX.writeFile(wb, "Listado_Participantes.xlsx");
      toast("Excel descargado", "bi-file-earmark-excel text-emerald-400");
    });

    /* ── Realtime ── */
    supabase
      .channel("admin_realtime")
      .on("postgres_changes", { event: "*", schema: "public", table: "registro_eventos" },
        async () => { await cargarDatos(); toast("Datos actualizados en tiempo real", "bi-arrow-repeat text-brand-400"); })
      .subscribe();

    /* ── Init ── */
    await cargarEventos();
    await cargarDatos();

  </script>
</body>
</html>
